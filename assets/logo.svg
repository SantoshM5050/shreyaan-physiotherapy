<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0F3D62"></stop>
<stop offset="100%" stop-color="#14B8A6"></stop>
</linearGradient>

<linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#1DD3C6"></stop>
<stop offset="100%" stop-color="#0B6AAE"></stop>
</linearGradient>

<filter id="shadow">
<feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"></feDropShadow>
</filter>

</defs>

<!-- Background -->
<rect width="1200" height="320" rx="28" fill="url(#bg)"></rect>

<!-- Decorative -->
<circle cx="1110" cy="70" r="120" fill="white" opacity=".04"></circle>
<circle cx="1030" cy="290" r="170" fill="white" opacity=".03"></circle>
<circle cx="80" cy="20" r="80" fill="white" opacity=".04"></circle>

<!-- Logo -->
<g transform="translate(70,58)" filter="url(#shadow)">

<rect x="0" y="0" width="150" height="150" rx="36" fill="url(#logoGrad)"></rect>

<!-- Heart -->
<path d="M75 112
L48 86
C34 72 34 49 52 40
C63 34 74 40 75 48
C76 40 87 34 98 40
C116 49 116 72 102 86
Z" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>

<!-- Spine -->
<line x1="75" y1="54" x2="75" y2="98" stroke="white" stroke-width="5" stroke-linecap="round"></line>

<circle cx="75" cy="58" r="3" fill="white"></circle>
<circle cx="75" cy="68" r="3" fill="white"></circle>
<circle cx="75" cy="78" r="3" fill="white"></circle>
<circle cx="75" cy="88" r="3" fill="white"></circle>

</g>

<!-- Heading -->
<text x="270" y="105" font-size="56" font-weight="700" font-family="Segoe UI,Arial,sans-serif" fill="white">

SHREYAAN

</text>

<text x="270" y="155" font-size="36" font-weight="600" font-family="Segoe UI,Arial,sans-serif" fill="#7DEBE0">

PHYSIOTHERAPY CENTER

</text>

<!-- Divider -->
<line x1="270" y1="180" x2="920" y2="180" stroke="#6DE7DD" stroke-width="2" opacity=".5"></line>

<!-- Subtitle -->
<text x="270" y="220" font-size="22" font-family="Segoe UI,Arial,sans-serif" fill="#EAFDFC">

Modern Physiotherapy Clinic • Healthcare CMS • Cloud Ready

</text>

<!-- Tech Stack -->
<text x="270" y="260" font-size="18" font-family="Segoe UI,Arial,sans-serif" fill="#CFFDFC">

Next.js • Express.js • MongoDB Atlas • Cloudinary • JWT • Tailwind CSS

</text>

<!-- Badge -->
<g transform="translate(930,215)">

<rect width="180" height="54" rx="27" fill="white" opacity=".12"></rect>

<text x="90" y="34" text-anchor="middle" font-size="20" font-family="Segoe UI" font-weight="700" fill="white">

🚀 Production Ready

</text>

</g>

</svg>